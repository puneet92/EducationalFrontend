<div class="topic-details-container">
  <!-- Side Menu for Subtopics -->
  <div class="sidebar">
    <h3 class="sidebar-title">Subtopics</h3>
    <ul class="subtopic-list">
      <li
        *ngFor="let subtopic of topics1?.subtopics; let i = index"
        class="subtopic-item"
        [class.active]="selectedSubtopic === subtopic"
        (click)="selectSubtopic(subtopic)">
        <span class="subtopic-number">{{i + 1}}.</span>
        <span class="subtopic-name">{{subtopic.title || subtopic.name}}</span>
      </li>
    </ul>
  </div>

  <!-- Main Content Area -->
  <div class="content-area">
    <div *ngIf="selectedSubtopic" class="subtopic-details">
      <h2 class="subtopic-heading">{{selectedSubtopic.title || selectedSubtopic.name}}</h2>
      <div class="subtopic-description">
        <p>{{selectedSubtopic.content || selectedSubtopic.description}}</p>
      </div>
    </div>

    <div *ngIf="!selectedSubtopic" class="no-selection">
      <h3>Select a subtopic from the menu to view details</h3>
    </div>
  </div>
</div>
